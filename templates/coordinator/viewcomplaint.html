{% extends 'coordinator/coordinator_index.html' %}
{% block body %}

<style>
    /* SCROLL FIX */
    .scroll-page {
        height: 100vh;
        overflow-y: auto;
        padding: 20px 20px 120px;
        background-color: #f4f6f9;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    table {
        width: 90%;
        margin: auto;
        border-collapse: collapse;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-size: 15px;
    }

    th, td {
        padding: 12px;
        text-align: center;
        border: 1px solid #ddd;
        vertical-align: middle;
    }

     th {
        background-color: #2c3e50;
        color: #fff;
    }


    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    a.reply-btn {
        text-decoration: none;
        padding: 6px 12px;
        background-color: #28a745;
        color: white;
        border-radius: 4px;
        font-size: 14px;
    }

    a.reply-btn:hover {
        background-color: #218838;
    }
</style>

<div class="scroll-page">

    <h1><b>View Complaints</b></h1>

    <table>
        <tr>
            <th>Complaint</th>
            <th>User</th>
            <th>Date</th>
            <th>Reply</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.Complaint }}</td>
            <td>{{ i.USER.Name }}</td>
            <td>{{ i.Date }}</td>
            <td>
                <a href="/myapp/admin_reply/{{ i.id }}" class="reply-btn">
                    Reply
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}
