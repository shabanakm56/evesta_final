{% extends 'coordinator/coordinator_index.html' %}
{% block body %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

<!-- Leaflet GeoSearch CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.8.0/dist/geosearch.css" />

<style>
    #map {
        height: 400px;
        margin-bottom: 20px;
    }

    .scroll-container {
        max-height: 85vh;
        overflow-y: auto;
        padding-right: 10px;
    }
</style>

<div class="container mt-4">
    <div class="scroll-container">
        <div class="card shadow p-4">
            <h4 class="text-center mb-4">Add Event</h4>

            <form action="/myapp/cordinator_addevent_post/" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Event Name</label>
                        <input type="text" class="form-control" name="textfield" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input type="place" class="form-control" name="textfield1" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Details</label>
                        <input type="text" class="form-control" name="textfield2" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Time</label>
                        <input type="time" class="form-control" id="time" name="textfield3" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Link</label>
                        <input type="text" class="form-control" id="Link" name="textfield4" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type</label>
                        <input type="text" class="form-control" id="Type" name="textfield5" required>
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Photo</label>
                        <input type="file" class="form-control" name="textfield8" required>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Select Location</label>
                    <div id="map"></div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Latitude</label>
                        <input type="text" class="form-control" id="latitude" name="latitude" readonly required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Longitude</label>
                        <input type="text" class="form-control" id="longitude" name="longitude" readonly required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Add</button>
            </form>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-geosearch@3.8.0/dist/geosearch.umd.js"></script>

<script>
    var map = L.map('map').setView([10.8505, 76.2711], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const provider = new GeoSearch.OpenStreetMapProvider({ countrycodes: 'in' });

    const searchControl = new GeoSearch.GeoSearchControl({
        provider: provider,
        style: 'bar',
        autoClose: true,
        showMarker: false
    });

    map.addControl(searchControl);

    var marker;

    function updateCoordinates(lat, lng) {
        document.getElementById('latitude').value = lat.toFixed(6);
        document.getElementById('longitude').value = lng.toFixed(6);

        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], 13);
    }

    map.on('click', function(e) {
        updateCoordinates(e.latlng.lat, e.latlng.lng);
    });

    map.on('geosearch/showlocation', function(e) {
        updateCoordinates(e.location.y, e.location.x);
    });
</script>

{% endblock %}
