{% extends 'adminn/admin_index.html' %}
{% block body %}
<style>
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    table {
        width: 90%;
        margin: auto;
        border-collapse: collapse;
        background: #fff;
    }

    th, td {
        padding: 10px;
        text-align: center;
        border: 1px solid #ddd;
    }

    th {
        background-color: #2c3e50;
        color: #fff;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    img {
        border-radius: 50%;
    }

    .actions a {
        display: inline-block;
        margin: 4px;
        padding: 5px 10px;
        text-decoration: none;
        color: #fff;
        border-radius: 4px;
        font-size: 14px;
    }

    .edit {
        background-color: #3498db;
    }

    .delete {
        background-color: #e74c3c;
    }

    .add-btn {
        display: block;
        width: 200px;
        margin: 20px auto;
        padding: 10px;
        text-align: center;
        background: #27ae60;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
    }
</style>

<h1>Coordinators</h1>

<table>
    <tr>
        <th>Photo</th>
        <th>Name</th>
        <th>DOB</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Action</th>
    </tr>

    {% for i in data %}
    <tr>
        <td>
            <img src="/media/{{ i.Photo }}" width="70" height="70">
        </td>
        <td>{{ i.Name }}</td>
        <td>{{ i.DOB }}</td>
        <td>{{ i.Gender }}</td>
        <td>{{ i.Phoneno }}</td>
        <td>{{ i.Email }}</td>
        <td class="actions">
            <a href="/myapp/admin_editcoordinator/{{ i.id }}" class="edit">Edit</a>
            <a href="/myapp/admin_del_coordinator/{{ i.id }}" class="delete">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

<a href="/myapp/admin_addcoordinator/" class="add-btn">Add New Coordinator</a>
{% endblock %}
