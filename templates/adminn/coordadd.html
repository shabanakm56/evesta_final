{% extends 'adminn/admin_index.html' %}
{% block body %}

<style>
    /* SCROLL FIX — works even if admin_index blocks scroll */
    .scroll-page {
        height: 100vh;
        overflow-y: auto;
        padding: 20px 0 120px; /* bottom space for button */
        background-color: #f4f6f9;
    }

    h1 {
        text-align: center;
        color: #333;
        margin: 20px 0;
    }

    .form-container {
        width: 500px;
        max-width: 95%;
        margin: auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    table {
        width: 100%;
    }

    td {
        padding: 10px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="file"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    input[type="radio"] {
        margin-right: 5px;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background-color: #0056b3;
    }
</style>

<div class="scroll-page">

    <h1>Add Coordinators</h1>

    <div class="form-container">
        <form method="post" action="/myapp/admin_add_cord_post/" enctype="multipart/form-data">
            {% csrf_token %}
            <table>
                <tr>
                    <td>Name :</td>
                    <td><input type="text" name="name" required></td>
                </tr>

                <tr>
                    <td>Gender :</td>
                    <td>
                        <input type="radio" name="Gender" value="Male" required> Male
                        <input type="radio" name="Gender" value="Female"> Female
                    </td>
                </tr>

                <tr>
                    <td>DOB :</td>
                    <td><input type="date" name="dob" required></td>
                </tr>

                <tr>
                    <td>Phone :</td>
                    <td><input type="number" name="phone" required></td>
                </tr>

                <tr>
                    <td>Email :</td>
                    <td><input type="email" name="email" required></td>
                </tr>

                <tr>
                    <td>Photo :</td>
                    <td><input type="file" name="photo" required></td>
                </tr>

                <tr>
                    <td>Username:</td>
                    <td><input type="text" name="username" required></td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" required></td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="submit" value="Add Coordinator" class="submit-btn">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</div>

{% endblock %}
