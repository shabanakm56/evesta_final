{% extends 'adminn/admin_index.html' %}
{% block body %}

<style>
    /* SCROLL FIX */
    .scroll-page {
        height: 100vh;
        overflow-y: auto;
        padding: 20px 20px 120px;
        background-color: #f4f6f9;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-size: 15px;
    }

    th, td {
        padding: 12px;
        text-align: center;
        border: 1px solid #ddd;
        vertical-align: middle;
    }

    th {
        background-color: #2c3e50;
        color: #fff;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    .rating {
        font-weight: bold;
        color: #ff9800;
    }
</style>

<div class="scroll-page">

    <h1><b>View feedback</b></h1>

    <table>
        <tr>
            <th>User</th>
            <th>Event</th>
            <th>Review</th>
            <th>Date</th>
            <th>Aspect</th>
            <th>Rating</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.USER.Name }}</td>
            <td>{{ i.EVENT.EventName }}</td>
            <td>{{ i.Review }}</td>
            <td>{{ i.date }}</td>
            <td>{{ i.Aspect }}</td>
            <td class="rating">
                {{ i.Rating|default:"-" }}
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}
