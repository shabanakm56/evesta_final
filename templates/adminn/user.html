{% extends 'adminn/admin_index.html' %}
{% block body %}

<style>
    /* SCROLL FIX */
    .scroll-page {
        height: 100vh;
        overflow-y: auto;
        padding: 20px 20px 120px;
        background-color: #f4f6f9;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    table {
        width: 95%;
        margin: auto;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    th, td {
        padding: 12px;
        text-align: center;
        border: 1px solid #ddd;
    }

     th {
        background-color: #2c3e50;
        color: #fff;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    a {
        text-decoration: none;
        padding: 6px 10px;
        border-radius: 4px;
        display: inline-block;
        margin: 2px 0;
        font-size: 14px;
    }

    .block {
        background-color: #dc3545;
        color: white;
    }

    .unblock {
        background-color: #28a745;
        color: white;
    }

    a:hover {
        opacity: 0.85;
    }
</style>

<div class="scroll-page">

    <h1><b>View Users</b></h1>

    <table>
        <tr>
            <th>Name</th>
            <th>DOB</th>
            <th>Gender</th>
            <th>Phone No</th>
            <th>Email</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.Name }}</td>
            <td>{{ i.DOB }}</td>
            <td>{{ i.Gender }}</td>
            <td>{{ i.Phoneno }}</td>
            <td>{{ i.Email }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}
